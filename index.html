<!DOCTYPE html>
<html lang="en">
<head>
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Mozilla+Headline:wght@200..700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>WordMine</title>
</head>
<body>
    <div class="status">
        <p id="gusses">20 Guesses</p>
        <p id="mines">5 💣</p>
    </div>

    <div class="wordBuffer"></div>
    <div class="timeLimit"></div>
    <div class="lives"></div>
    <div class="previousWords"></div>
    <div class="letterBoard"></div>
    <div class="keyboard">
        <div class="row">
            <button onclick="OS_Keyboard('Q')" class="key">Q</button>
            <button onclick="OS_Keyboard('W')" class="key">W</button>
            <button onclick="OS_Keyboard('E')" class="key">E</button>
            <button onclick="OS_Keyboard('R')" class="key">R</button>
            <button onclick="OS_Keyboard('T')" class="key">T</button>
            <button onclick="OS_Keyboard('Y')" class="key">Y</button>
            <button onclick="OS_Keyboard('U')" class="key">U</button>
            <button onclick="OS_Keyboard('I')" class="key">I</button>
            <button onclick="OS_Keyboard('O')" class="key">O</button>
            <button onclick="OS_Keyboard('P')" class="key">P</button>
        </div>
        <div class="row">
            <button onclick="OS_Keyboard('A')" class="key">A</button>
            <button onclick="OS_Keyboard('S')" class="key">S</button>
            <button onclick="OS_Keyboard('D')" class="key">D</button>
            <button onclick="OS_Keyboard('F')" class="key">F</button>
            <button onclick="OS_Keyboard('G')" class="key">G</button>
            <button onclick="OS_Keyboard('H')" class="key">H</button>
            <button onclick="OS_Keyboard('J')" class="key">J</button>
            <button onclick="OS_Keyboard('K')" class="key">K</button>
            <button onclick="OS_Keyboard('L')" class="key">L</button>
        </div>
        <div class="row">
            <button onclick="OS_Keyboard('Z')" class="key">Z</button>
            <button onclick="OS_Keyboard('X')" class="key">X</button>
            <button onclick="OS_Keyboard('C')" class="key">C</button>
            <button onclick="OS_Keyboard('V')" class="key">V</button>
            <button onclick="OS_Keyboard('B')" class="key">B</button>
            <button onclick="OS_Keyboard('N')" class="key">N</button>
            <button onclick="OS_Keyboard('M')" class="key">M</button>
        </div>
    </div>

    <button class="enterWord">Enter</button>
    <button class="removeLetter">Backspace</button>

    <script src="script.js"></script>
</body>
</html>
